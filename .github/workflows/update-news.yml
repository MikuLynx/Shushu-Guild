name: Update news

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feed
        env:
          NEWS_FEED_URL: ${{ secrets.NEWS_FEED_URL }}
        run: python3 scripts/fetch_news.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add js/news-auto.json
          if git diff --cached --quiet; then
            echo "No new posts."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "Update news"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
