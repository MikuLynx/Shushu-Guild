<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season 3 Roster — ShuShu Guild</title>
<meta name="description" content="ShuShu Guild Season 3 roster: registered members by role and SS2 server.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <a class="brand" href="index.html">ShuShu <span>Guild</span></a>
  <button class="burger" aria-label="Menu" onclick="document.body.classList.toggle('open')">☰</button>
  <nav>
    <a href="index.html#schedule">Schedule</a>
    <a href="index.html#news">News</a>
    <a href="season3.html">Roster</a>
    <a href="regis.html" class="cta">Registration Season 3</a>
  </nav>
</header>

<main>
  <div class="page-hero"></div>

  <section class="panel wide roster">
    <div class="r-head">
      <div>
        <h2>Season 3 Roster</h2>
        <p class="sub">1 soldier = 1 registrant · <span id="r-updated">loading…</span></p>
      </div>
      <div class="r-total">
        <div><strong id="r-total-n">–</strong> <span>registered</span></div>
        <div id="r-total-pills" class="r-pills"></div>
      </div>
    </div>

    <p id="r-status" class="r-status" role="status"></p>

    <div id="r-cards" class="r-cards"></div>

    <h3 class="r-h3">SS2 server</h3>
    <div id="r-servers" class="r-servers"></div>

    <div class="r-toolbar">
      <div id="r-tabs" class="r-tabs"></div>
      <input type="search" id="r-search" placeholder="Search name…" maxlength="40" aria-label="Search name">
    </div>
    <div id="r-list" class="r-list"></div>
  </section>
</main>

<footer>© <span id="yr"></span> ShuShu Guild · Stronger Alliance, Greater Victory</footer>
